
[general]
	#Language of the messages players see. Bundled: en_us, ru_ru.
	#The mod is installed on the server only, so these strings are resolved here
	#and sent as plain text; a vanilla client cannot translate them itself.
	#Any wording can be overridden without rebuilding the mod by creating
	#config/serverlogin/lang/<language>.json with only the keys you want to change.
	#Keys are listed in serverlogin/lang/en_us.json inside the mod JAR.
	language = "en_us"

[login]
	#Minimum password length.
	#Range: 6 ~ 64
	minPasswordLength = 6
	#Maximum password length.
	#Range: 64 ~ 128
	maxPasswordLength = 64
	#Authentication timeout in seconds.
	#Set to 0 to disable it; use /auth kick manually.
	#Range: 0 ~ 86400
	timeoutSeconds = 900
	#Seconds before the timeout warning.
	#Set to 0 to disable the warning.
	#Range: 0 ~ 3600
	timeoutWarningSeconds = 60
	#Incorrect passwords allowed before disconnect.
	#Range: 1 ~ 20
	maxAttempts = 5
	#Account lockout duration in seconds.
	#Range: 10 ~ 3600
	lockoutSeconds = 60

[gate]
	#Commands an unauthenticated player may run: the root only, no slash and no arguments.
	#Everything the player sends is denied by default, so this list is the whole
	#attack surface before login. Do not add commands unrelated to authentication.
	allowedCommands = ["login", "l"]
	#Plugin channels reachable before login.
	#Needed by mods that handshake exactly once on join and never retry:
	#Simple Voice Chat asks for its secret right after join, and dropping that
	#request leaves voice dead for the whole session even after /login.
	#
	#An entry is either a whole namespace ("voicechat") or one exact channel
	#("voicechat:secret"). Prefer exact channels: a namespace opens every payload
	#the mod owns, including any that change player state, just because one of them
	#is needed for the handshake. The defaults are namespaces only because the exact
	#set differs per modpack. Set diagnostics.logBlockedPayloads=true, join once with
	#a real client, read which channels the log reports, then narrow this list to them.
	#
	#Opening a channel only permits the connection. Deny the actions themselves
	#with permissions via the serverlogin:authenticated context, not by closing the channel.
	allowedPayloadChannels = ["minecraft", "forge", "fml", "voicechat", "jem_security:main"]
	#Password hashes started per second across the whole server.
	#The per-player guard stops one account from queueing work; this stops a crowd.
	#On an offline-mode server, connecting under many names is cheap, and every
	#name can otherwise spend a slot of the account store's queue.
	#Bursts of twice this value are allowed before throttling begins.
	#Range: 1 ~ 200
	maxCredentialChecksPerSecond = 8
	#Password hashes started per minute from one network address.
	#Behind a proxy this only works when IP forwarding is configured (Velocity
	#modern forwarding, or BungeeCord forwarding). Without it every connection
	#looks like it comes from the proxy and this becomes a second global limit,
	#which is why the default is generous and the per-second cap is the real defence.
	#Range: 1 ~ 600
	maxCredentialChecksPerAddressPerMinute = 30

[security]
	#PBKDF2-HMAC-SHA256 work factor.
	#Range: 600000 ~ 2000000
	pbkdf2Iterations = 600000

[chat]
	#Administrator local chat radius in blocks.
	#Range: 1 ~ 1000
	adminLocalRadius = 100

[diagnostics]
	#Log every authentication step to the server log.
	#Useful while setting the mod up; noisy on a busy public server.
	#Kicks and connection errors are logged regardless of this setting.
	verboseLogging = false
	#Print the call chain behind every disconnect.
	#This is what names the mod that kicked the player, so turn it on while
	#investigating unexplained disconnects and off again afterwards.
	logDisconnectStacks = false
	#Log every plugin channel an unauthenticated player uses, allowed or denied.
	#Each channel is reported once per server run, so this is safe to leave on
	#for a session. This is how you find the exact channel list a modpack needs
	#before narrowing gate.allowedPayloadChannels from namespaces to exact channels.
	logBlockedPayloads = false
	#After a player joins, keep logging whether they are still connected for this many seconds.
	#A troubleshooting aid for sessions that die shortly after join.
	#0 disables the watchdog, which is the default.
	#Range: 0 ~ 600
	joinWatchSeconds = 0

