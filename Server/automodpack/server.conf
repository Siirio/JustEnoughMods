modpack-host: true
generate-modpack-on-start: false
auto-exclude-server-side-mods: false
require-modpack: true
advertise-versions-to-sync: true
self-updater: false
connection-mode: HOLEPUNCH
bind-address: ""
bind-port: -1
advertised-endpoint-host: ""
advertised-endpoint-port: -1
bandwidth-limit: 0
disable-internal-tls: false
accept-proxy-protocol: false
validate-secrets: true
secret-lifetime: 336
export-http-directory: ""
export-http-include-all: false

modpack {
  name: "JustEnoughMods"
  General {
    main {
      display-name: "JustEnoughMods"
      description: "Official ForeverSMP client files"
      required: true
      default-selected: true
      requires: []
      breaks-with: []
      compatible-platforms: []
      # extra paths from the server root
      from-server: []
      # drop these from the pack; they do not add files
      exclude: [**/.*, **/.*/**, **/*.tmp, **/*.disabled, **/*.bak, mods/jem-bootstrap.jar, config/jei/world/**, options.txt, servers.dat, saves/**, screenshots/**, logs/**, crash-reports/**, JustEnoughMods.jar, JustEnoughMods.json, TLauncherAdditional.json]
      # pack files players may change; listing a path here does not add it to the pack
      editable: []
    }
  }
}
# extra loaders allowed to join; this server's loader is always accepted
accepted-loaders: [forge]
