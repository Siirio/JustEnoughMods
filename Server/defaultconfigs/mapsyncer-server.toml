[general]
	# Let MapSyncer choose a bounded worker count from the available processors
	maxConcurrentRegions = 0
	maxSyncPacketSize = 262144
	# Share every generated region. Unchanged regions are skipped by timestamp and hash
	syncRadiusRegions = 0
	syncSpeedLimitKBps = 1024
	enableDebugLogging = false

[incremental_update]
	# Re-scan periodically so newly generated or changed MCA regions become available to every client
	incrementalUpdateMode = "TICK"
	# Five minutes. MapSyncer compares region timestamps and hashes instead of retransmitting unchanged data
	incrementalUpdateIntervalTicks = 6000
	scheduledUpdateHour = 4
	scheduledUpdateMinute = 0
