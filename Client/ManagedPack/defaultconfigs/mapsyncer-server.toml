[general]
	# Keep map conversion below gameplay thread and disk pressure
	maxConcurrentRegions = 1
	maxSyncPacketSize = 262144
	# Share every generated region. Unchanged regions are skipped by timestamp and hash
	syncRadiusRegions = 0
	syncSpeedLimitKBps = 1024
	enableDebugLogging = false

[incremental_update]
	# Keep MapSyncer's client auto-sync policy. JEM Performance replaces the forced-save timer
	incrementalUpdateMode = "TICK"
	# Two minutes. Only regions already saved by Minecraft can appear in the map
	incrementalUpdateIntervalTicks = 2400
	scheduledUpdateHour = 4
	scheduledUpdateMinute = 0
