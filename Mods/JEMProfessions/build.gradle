plugins { id 'net.minecraftforge.gradle' version '6.0.54'; id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' }
group = 'com.siirio.jemprofessions'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
def developmentLibraries = providers.gradleProperty('jemDevelopmentLibraries')
        .getOrElse(rootProject.file('.gradle/jem-development-libraries').absolutePath)
repositories { flatDir { dirs '../../Server/mods', developmentLibraries } }

// Sandbox packaging reuses the real profession owner, with a separate screen and entry point.
def professionProfile = providers.gradleProperty('professionProfile').getOrElse('production')
if (!(professionProfile in ['sandbox', 'production'])) throw new GradleException('professionProfile must be sandbox or production')
if (providers.gradleProperty('professionProfileOutput').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('professionProfileOutput').get())
}
sourceSets.main.java.srcDir "src/${professionProfile}/java"
sourceSets.main.resources.srcDir "src/${professionProfile}/resources"
tasks.named('processResources') {
    inputs.property('professionProfile',professionProfile)
    inputs.file 'build.gradle'
    filesMatching('META-INF/mods.toml') {
        def metadata = '\n[[mods]]\nmodId="jem_professions_sandbox"\nversion="1.0.0"\ndisplayName="JEM Professions Sandbox Controls"\ndescription="Explicit integrated-owner profession capability."\n'
        [jem_economy:'1.3.0',jem_settlements:'2.1.0',create:'6.0.8',epicfight:'20.14.17',
         playerrevive:'2.0.31',irons_spellbooks:'1.20.1-3.15.6',tinyinv:'1.1.0.1',recruits:'1.15.2'].each { mod, minimum ->
            metadata += "\n[[dependencies.jem_professions_sandbox]]\nmodId=\"${mod}\"\nmandatory=true\nversionRange=\"[${minimum},)\"\nordering=\"AFTER\"\nside=\"BOTH\"\n"
        }
        expand(sandboxMetadata: professionProfile == 'sandbox' ? metadata : '')
    }
}
if (professionProfile == 'sandbox') {
    tasks.register('extractNativeCompileJars', Copy) {
        from(zipTree(file('../../Server/mods/create-1.20.1-6.0.8.jar'))) {
            include 'META-INF/jarjar/*.jar'
            eachFile { path = name }
            includeEmptyDirs = false
        }
        into file('build/native-libs')
    }
    tasks.named('compileJava') { dependsOn 'extractNativeCompileJars' }
    def sandboxData = layout.buildDirectory.dir('generated/sandbox-resources')
    sourceSets.main.resources.srcDir sandboxData
    tasks.register('prepareSandboxData', Exec) {
        commandLine 'python', 'prepare-sandbox-data.py', sandboxData.get().asFile.absolutePath
        inputs.dir '../../Client/ManagedPack/config/paxi/datapacks/jem-profession-skills/data'
        inputs.files 'prepare-sandbox-data.py', 'src/sandbox/resources/assets/jem_professions/sandbox-skills.json', 'src/main/java/com/siirio/jemprofessions/tree/ProfessionCatalog.java'
        outputs.dir sandboxData
    }
    tasks.named('processResources') { dependsOn 'prepareSandboxData' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly project(path: ':JEMIdentity', configuration: 'jemCompile')
    compileOnly files('../../Server/mods/irons_spellbooks-1.20.1-3.15.6.jar')
    // Development-only native API input; never copied to the managed pack.
    compileOnly files("${developmentLibraries}/puffish_skills-0.19.2-1.20-forge.jar")
    if (professionProfile == 'sandbox') {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        compileOnly project(path: ':JEMEconomy', configuration: 'jemCompile')
        compileOnly project(path: ':JEMSettlements', configuration: 'jemCompile')
        compileOnly fg.deobf('local:create:1.20.1-6.0.8')
        compileOnly fg.deobf('local:epic-fight:20.14.17-mc1.20.1-forge')
        compileOnly fg.deobf('local:PlayerRevive_FORGE_v2.0.31_mc1.20.1:installed')
        compileOnly fg.deobf('local:CreativeCore_FORGE_v2.12.40_mc1.20.1:installed')
        compileOnly fg.deobf('local:recruits:1.20.1-1.15.2')
        compileOnly fileTree(dir: 'build/native-libs', include: '*.jar')
    }
}
if (professionProfile == 'sandbox') {
    mixin { add sourceSets.main, 'jem_professions_sandbox.refmap.json'; config 'jem_professions_sandbox.mixins.json' }
    jar { manifest { attributes 'MixinConfigs': 'jem_professions_sandbox.mixins.json' } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17; options.incremental = false }
tasks.withType(Test).configureEach { enabled = false }
jar {
    archiveBaseName = 'jem-professions'
    if (professionProfile == 'sandbox') archiveClassifier = 'sandbox'
    manifest { attributes 'JEM-Profession-Profile': professionProfile.toUpperCase(java.util.Locale.ROOT) }
    finalizedBy 'reobfJar'
}
tasks.register('sandboxJar', GradleBuild) {
    buildName = 'jem-professions-sandbox'
    dir = projectDir
    tasks = [':JEMProfessions:jar']
    startParameter.projectProperties = gradle.startParameter.projectProperties + [
        professionProfile: 'sandbox',
        professionProfileOutput: new File(projectDir, 'build/sandbox-profile').absolutePath
    ]
}
