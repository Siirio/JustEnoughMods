plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = 'com.justenoughmods'
version = '5.2.0'

def instanceOverride = findProperty('jemRuntimeRoot') ?: findProperty('jem_instance') ?: System.getenv('JEM_INSTANCE')
def jemRuntimeRoot = file(instanceOverride?.toString()?.trim() ?: '../../Client/ManagedPack')

def createJar = file("${jemRuntimeRoot}/mods/create-1.20.1-6.0.8.jar")
def ponderName = zipTree(createJar).matching { include 'META-INF/jarjar/Ponder-Forge-*.jar' }.singleFile.name
def extractedPonder = layout.buildDirectory.file("create-libs/${ponderName}")
def extractPonder = tasks.register('extractPonder', Copy) {
    from zipTree(createJar)
    include 'META-INF/jarjar/Ponder-Forge-*.jar'
    eachFile { details -> details.path = details.name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('create-libs')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

