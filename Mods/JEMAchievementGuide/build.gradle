mixin {
    add sourceSets.main, 'jem_advancements.refmap.json'
    config 'jem_advancements.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractPonder
    options.encoding = 'UTF-8'
    options.release = 17
    options.incremental = false
}

afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        ['refMapFile', 'outTsrgFile'].each { name ->
            if (extensions.extraProperties.has(name)) outputs.file(extensions.extraProperties.get(name))
        }
    }
}

jar {
    archiveBaseName = 'jem-advancements'
    manifest {
        attributes([
            'Specification-Title': 'JEM Advancement Guide',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'jem_advancements.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
    doFirst {
        def refmap = tasks.named('compileJava').get().extensions.extraProperties.get('refMapFile')
        if (!file(refmap).isFile()) throw new GradleException('Generated Advancement Guide Mixin refmap is missing')
    }
}

tasks.withType(Test).configureEach { enabled = false }
