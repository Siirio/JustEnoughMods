plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

repositories {
    mavenCentral()
}

def instanceOverride = findProperty('jem_instance') ?: System.getenv('JEM_INSTANCE')
def instancePath = file(instanceOverride?.toString()?.trim() ?: '../../Client/ManagedPack')

def installedMod = { String pattern ->
    def matches = fileTree(dir: file("${instancePath}/mods"), include: pattern).files
    if (matches.size() != 1) {
        throw new GradleException("Expected one installed mod matching ${pattern}, found ${matches.size()}")
    }
    matches.first()
}

// Compile against the exact API already supplied by the installed Nightfall.
// Extraction is build-only: no library is bundled or installed by this module.
def mixinSquaredApi = layout.buildDirectory.file('compile-only/MixinSquared-0.2.0-beta.6.jar')
def extractMixinSquaredApi = tasks.register('extractMixinSquaredApi') {
    def nativeJar = installedMod('EpicFight*Nightfall-3.4.1*.jar')
    inputs.file(nativeJar)
    outputs.file(mixinSquaredApi)
    doLast {
        byte[] forgeBytes
        new java.util.zip.ZipFile(nativeJar).withCloseable { archive ->
            def entry = archive.getEntry('META-INF/jarjar/mixinsquared-forge-0.2.0-beta.6.jar')
            if (entry == null) throw new GradleException('Installed Nightfall does not provide the audited MixinSquared 0.2.0-beta.6 API')
            forgeBytes = archive.getInputStream(entry).withCloseable { it.readAllBytes() }
        }
        new java.util.zip.ZipInputStream(new ByteArrayInputStream(forgeBytes)).withCloseable { nested ->
            def entry
            boolean found = false
            while ((entry = nested.nextEntry) != null) {
                if (entry.name == 'META-INF/jars/MixinSquared-0.2.0-beta.6.jar') {
                    def destination = mixinSquaredApi.get().asFile
                    destination.parentFile.mkdirs()
                    destination.bytes = nested.readAllBytes()
                    found = true
                    break
                }
            }
            if (!found) throw new GradleException('Installed MixinSquared Forge JAR is missing the audited nested core API')
        }
    }
}

dependencies {
    compileOnly files(mixinSquaredApi).builtBy(extractMixinSquaredApi)
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf(files(installedMod('Jade-*.jar')))
    compileOnly fg.deobf(files(installedMod('jei-*.jar')))
    compileOnly fg.deobf(files(installedMod('curios-forge-*.jar')))
    compileOnly fg.deobf(files(installedMod('enhancedai-*.jar')))
    compileOnly fg.deobf(files(installedMod('insanelib-*.jar')))
    compileOnly fg.deobf(files(installedMod('block_factorys_bosses-*.jar')))
    compileOnly fg.deobf(files(installedMod('geckolib-forge-*.jar')))
    compileOnly fg.deobf(files(installedMod('aquamirae-*.jar')))
    compileOnly fg.deobf(files(installedMod('L_Enders_Cataclysm-*.jar')))
    compileOnly fg.deobf(files(installedMod('lionfishapi-*.jar')))
    compileOnly files(installedMod('unearthed_journey-*.jar'))
    compileOnly fg.deobf(files(installedMod('legendarymonsters-*.jar')))
    compileOnly fg.deobf(files(installedMod('Luminous*Beasts*.jar')))
    compileOnly fg.deobf(files(installedMod('endrem_forge-*.jar')))
    compileOnly fg.deobf(files(installedMod('trotting_wagons-*.jar')))
    compileOnly fg.deobf(files(installedMod('immersive_aircraft-*.jar')))
    compileOnly fg.deobf(files(installedMod('backpacked-forge-*.jar')))
    compileOnly fg.deobf(files(installedMod('framework-forge-*.jar')))
    compileOnly fg.deobf(files(installedMod('spawn-*.jar')))
    compileOnly fg.deobf(files(installedMod('SereneSeasons-forge-*.jar')))
    compileOnly fg.deobf(files(installedMod('GlitchCore-forge-*.jar')))
    compileOnly files(installedMod('BetterAdvancements-*.jar'))
    compileOnly project(path: ':JEMAchievementGuide', configuration: 'jemCompile')
    compileOnly project(path: ':JEMIdentity', configuration: 'jemCompile')
    compileOnly project(path: ':JEMWorldBossTiers', configuration: 'jemCompile')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

def mixinRefmapName = 'jemcompat.refmap.json'

mixin {
    add sourceSets.main, mixinRefmapName
    config 'jemcompat.mixins.json'
    config 'jemcompat.seasons.mixins.json'
}

tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file("tmp/compileJava/${mixinRefmapName}"))
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.named('processResources', ProcessResources).configure {
    from('../../Catalog/changes/food-quality-assignments.json') {
        into 'data/jemcompat'
        rename { 'food_quality.json' }
    }
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '2',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors,
                'FMLAT': 'accesstransformer.cfg',
                'MixinConfigs': 'jemcompat.mixins.json,jemcompat.seasons.mixins.json'
        ])
    }
    doLast {
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { archive ->
            if (archive.getEntry(mixinRefmapName) == null) {
                throw new GradleException("Missing required Mixin refmap ${mixinRefmapName} in ${archiveFile.get().asFile.name}")
            }
        }
    }
    finalizedBy 'reobfJar'
}

tasks.register('installToModpack', Copy) {
    dependsOn 'build'
    from tasks.named('jar').flatMap { it.archiveFile }
    into file("${instancePath}/mods")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
}

tasks.withType(Test).configureEach { enabled = false }
