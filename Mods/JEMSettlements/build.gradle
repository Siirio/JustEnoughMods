plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)'; id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' }
group = 'com.siirio.jemsettlements'
version = '2.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { flatDir { dirs '../../Server/mods' } }

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files('../JEMIdentity/build/classes/java/main')
    compileOnly files('../JEMCurrencyCore/build/classes/java/main')
    compileOnly fg.deobf(files('../../Server/mods/Jade-1.20.1-Forge-11.13.3.jar'))
    compileOnly fg.deobf('local:recruits:1.20.1-1.15.2')
    compileOnly fg.deobf(files('../../Server/mods/workers-1.20.1-2.0.3.jar'))
}
mixin { add sourceSets.main, 'jem_settlements.refmap.json'; config 'jem_settlements.mixins.json' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17; options.incremental = false }
tasks.withType(Test).configureEach { enabled = false }
// Explicit economy-overhaul suite; ordinary builds never run it.
tasks.register('settlementEconomyContractTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.siirio.jemsettlements.town.SettlementEconomyContracts'
}

jar { archiveBaseName = 'jem-settlements'; manifest { attributes 'MixinConfigs': 'jem_settlements.mixins.json' }; finalizedBy 'reobfJar' }

apply from: '../JEMCurrencyCore/embed.gradle'
