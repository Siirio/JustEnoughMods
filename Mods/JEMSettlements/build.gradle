plugins { id 'net.minecraftforge.gradle' version '6.0.54'; id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' }
group = 'com.siirio.jemsettlements'
version = '2.1.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { flatDir { dirs '../../Server/mods' } }
def xaeroWorldMap = file('../../Client/ManagedPack/mods/xaeroworldmap-forge-1.20.1-1.46.0.jar')
def xaeroLib = layout.buildDirectory.file('xaero-lib/xaerolib-forge-1.20.1-1.7.3.jar')
tasks.register('extractXaeroLib', Copy) {
    from(zipTree(xaeroWorldMap)) {
        include 'META-INF/jarjar/xaerolib-forge-1.20.1-1.7.3.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('xaero-lib')
}
tasks.named('compileJava').configure { dependsOn 'extractXaeroLib' }

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files(xaeroWorldMap)
    compileOnly files(xaeroLib)
    compileOnly project(path: ':JEMIdentity', configuration: 'jemCompile')
    compileOnly project(path: ':JEMEconomy', configuration: 'jemCompile')
    compileOnly fg.deobf(files('../../Server/mods/Jade-1.20.1-Forge-11.13.3.jar'))
    compileOnly fg.deobf('local:recruits:1.20.1-1.15.2')
    compileOnly fg.deobf(files('../../Client/ManagedPack/mods/PatPat-1.3.1%2B1.20.1%2Bforge.jar'))
    compileOnly fg.deobf(files('../../Client/ManagedPack/mods/fairylights-7.0.0-1.20.1.jar'))
}
mixin { add sourceSets.main, 'jem_settlements.refmap.json'; config 'jem_settlements.mixins.json' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17; options.incremental = false }
tasks.withType(Test).configureEach { enabled = false }
jar { archiveBaseName = 'jem-settlements'; manifest { attributes 'MixinConfigs': 'jem_settlements.mixins.json' }; finalizedBy 'reobfJar' }
