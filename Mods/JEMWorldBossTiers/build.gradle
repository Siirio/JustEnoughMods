plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'jem-world-boss-tiers'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'jem_world_boss_tiers.refmap.json'
    config 'jem_world_boss_tiers.mixins.json'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

sourceSets.test.resources {
    srcDir '../JEMPackCore/src/main/resources'
    include 'data/jem_world_boss_tiers/jem_world_boss_tiers/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': 'Siirio',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor': 'Siirio',
                'MixinConfigs': 'jem_world_boss_tiers.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
