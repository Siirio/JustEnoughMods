plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'jem-world-boss-tiers'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('../JEMRewards/build/classes/java/main')
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf(files('../../Server/mods/irons_spellbooks-1.20.1-3.15.6.jar'))
    compileOnly fg.deobf(files('../../Server/mods/epic-fight-20.14.17-mc1.20.1-forge.jar'))
}

mixin {
    add sourceSets.main, 'jem_world_boss_tiers.refmap.json'
    config 'jem_world_boss_tiers.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': 'Siirio',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor': 'Siirio',
                'MixinConfigs': 'jem_world_boss_tiers.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(Test).configureEach { enabled = false }
