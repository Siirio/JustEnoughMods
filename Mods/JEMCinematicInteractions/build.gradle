plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.siirio.jemcinematicinteractions'
version = '1.0.3'
base { archivesName = 'jem-cinematic-interactions' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories { mavenCentral() }
def sandboxMods = file("${System.getenv('APPDATA')}/.minecraft/versions/jem sandbox/mods")
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly fg.deobf(files(new File(sandboxMods, 'Cinematic.Interaction-Forge-1.20.1-0.18.11.jar')))
    compileOnly fg.deobf(files(new File(sandboxMods, 'jei-1.20.1-forge-15.49.0.194.jar')))
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { enabled = false }
jar {
    manifest { attributes 'MixinConfigs': 'jem_cinematic_interactions.mixins.json' }
    finalizedBy 'reobfJar'
}
