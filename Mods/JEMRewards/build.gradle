plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '1.0.0'
group = 'com.siirio.jemrewards'
base { archivesName = 'jem-rewards' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files('../../Client/ManagedPack/mods/jei-1.20.1-forge-15.49.0.194.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { finalizedBy 'reobfJar' }
tasks.withType(Test).configureEach { enabled = false }
