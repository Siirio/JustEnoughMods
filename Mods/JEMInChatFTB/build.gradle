plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group_id
version = mod_version

base { archivesName = mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'in_chat_ftb.refmap.json'
    config 'in_chat_ftb.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.incremental = false
}

tasks.named('processResources', ProcessResources).configure {
    def values = [minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties values
    filesMatching('META-INF/mods.toml') { expand values }
}

afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        ['refMapFile', 'outTsrgFile'].each { name ->
            if (extensions.extraProperties.has(name)) outputs.file(extensions.extraProperties.get(name))
        }
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'In chat FTB',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'in_chat_ftb.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
    doFirst {
        def refmap = tasks.named('compileJava').get().extensions.extraProperties.get('refMapFile')
        if (!file(refmap).isFile()) throw new GradleException('Generated In chat FTB Mixin refmap is missing')
    }
}

tasks.withType(Test).configureEach { enabled = false }
