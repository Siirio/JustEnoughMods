plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}

repositories {
    mavenCentral()
}

def instanceOverride = findProperty('jem_instance') ?: System.getenv('JEM_INSTANCE')
def instancePath = file(instanceOverride?.toString()?.trim() ?: '../../Client/ManagedPack')

def installedMod = { String pattern ->
    def matches = fileTree(dir: file("${instancePath}/mods"), include: pattern).files
    if (matches.size() != 1) {
        throw new GradleException("Expected one installed mod matching ${pattern}, found ${matches.size()}")
    }
    matches.first()
}

def xaeroWorldMap = installedMod('xaeroworldmap-forge-*.jar')
def xaeroMinimap = installedMod('xaerominimap-forge-*.jar')
def tradeCycling = installedMod('trade-cycling-forge-*.jar')
ext.jemXaeroWorldMap = xaeroWorldMap
apply from: rootProject.file('gradle/xaero-library.gradle')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files(xaeroWorldMap)
    compileOnly files(xaeroMinimap)
    compileOnly files(tradeCycling)
    compileOnly jemXaeroCompileLib
    compileOnly project(path: ':JEMWorldBossTiers', configuration: 'jemCompile')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('compileJava').configure {
    dependsOn 'extractXaeroLib'
}

mixin {
    add sourceSets.main, 'jem_twelve_eyes.refmap.json'
    config 'jem_twelve_eyes.mixins.json'
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '2',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors,
                'MixinConfigs': 'jem_twelve_eyes.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('installToModpack', Copy) {
    dependsOn 'build'
    from tasks.named('jar').flatMap { it.archiveFile }
    into file("${instancePath}/mods")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

 tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file('tmp/compileJava/jem_twelve_eyes.refmap.json'))
 }

tasks.withType(Test).configureEach { enabled = false }
