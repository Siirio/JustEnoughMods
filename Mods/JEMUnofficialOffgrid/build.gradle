plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}

def offgridJar = file('../../Client/ManagedPack/mods/offgrid-forge-1.0.4-1.20.1.jar')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf(files(offgridJar))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'unofficial_offgrid.refmap.json'
    config 'unofficial_offgrid.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand properties }
}

tasks.named('jar', Jar).configure {
    manifest { attributes('MixinConfigs': 'unofficial_offgrid.mixins.json') }
    doLast {
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { jar ->
            if (jar.getEntry('unofficial_offgrid.refmap.json') == null) {
                throw new GradleException('Missing Unofficial Offgrid refmap')
            }
        }
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
}

tasks.withType(Test).configureEach { enabled = false }
