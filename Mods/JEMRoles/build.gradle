plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.siirio.jemroles'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files('../JEMIdentity/build/classes/java/main')
    compileOnly files('../JEMEconomy/build/classes/java/main')
    compileOnly files('../JEMProfessions/build/classes/java/main')
    compileOnly fg.deobf(files('../../Server/mods/irons_spellbooks-1.20.1-3.15.6.jar'))
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(Test).configureEach { enabled = false }
jar { archiveBaseName = 'jem-roles'; finalizedBy 'reobfJar' }
