plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
group = 'com.siirio.jemroles'
version = '2.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files('../JEMIdentity/build/classes/java/main')
    compileOnly files('../JEMEconomy/build/classes/java/main')
    compileOnly fg.deobf(files('../../Server/mods/irons_spellbooks-1.20.1-3.15.6.jar'))
    compileOnly fg.deobf(files('../../Server/mods/lodestone-1.20.1-1.6.4.1.jar'))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(Test).configureEach { enabled = false }
def mixinRefmapName = 'jem_roles.refmap.json'
mixin { add sourceSets.main, mixinRefmapName; config 'jem_roles.mixins.json' }
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file("tmp/compileJava/${mixinRefmapName}"))
}
jar {
    archiveBaseName = 'jem-roles'
    manifest { attributes 'MixinConfigs': 'jem_roles.mixins.json' }
    doLast {
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { archive ->
            if (archive.getEntry(mixinRefmapName) == null) {
                throw new GradleException("Missing required Mixin refmap ${mixinRefmapName} in ${archiveFile.get().asFile.name}")
            }
        }
    }
    finalizedBy 'reobfJar'
}
