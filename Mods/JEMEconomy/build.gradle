plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
group = 'com.siirio.jemeconomy'
version = '1.3.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly project(path: ':JEMIdentity', configuration: 'jemCompile')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17; options.incremental = false }
tasks.withType(Test).configureEach { enabled = false }
mixin { add sourceSets.main, 'jem_currency_core.refmap.json'; config 'jem_currency_core.mixins.json' }
jar {
    archiveBaseName = 'jem-economy'
    manifest { attributes 'MixinConfigs': 'jem_currency_core.mixins.json' }
    finalizedBy 'reobfJar'
}
