plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
// Own properties also work when this module is built outside the JEM graph.
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        url = 'https://raw.githubusercontent.com/Xylonity/maven-centralish/main/maven/'
        content { includeGroup 'dev.xylonity.knightlib' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('maven.modrinth:alexs-mobs:1.22.9')
    compileOnly fg.deobf('maven.modrinth:alexs-caves:2.0.2')
    compileOnly fg.deobf('maven.modrinth:citadel:2.6.3')
    compileOnly fg.deobf('maven.modrinth:irons-spells-n-spellbooks:1.20.1-3.15.6')
    compileOnly fg.deobf('dev.xylonity.knightlib:knightlib-forge-1.20.1:2.0.0')
    compileOnly fg.deobf('curse.maven:knight-lib-1105855:8829349')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'mobhome.refmap.json'
    config 'mobhome.mixins.json'
}
tasks.named('processResources', ProcessResources).configure {
    def properties = [minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand properties }
}
tasks.named('jar', Jar).configure {
    manifest { attributes('MixinConfigs': 'mobhome.mixins.json') }
    doLast {
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { jar ->
            if (jar.getEntry('mobhome.refmap.json') == null) throw new GradleException('Missing Mob Home refmap')
        }
    }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
}
