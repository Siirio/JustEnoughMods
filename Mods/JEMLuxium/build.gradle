plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}

repositories {
    mavenCentral()
}

def instancePath = providers.gradleProperty('jem_instance')
        .orElse(providers.environmentVariable('JEM_INSTANCE'))
        .orElse(rootProject.file('Client/ManagedPack').absolutePath)
        .get()

def installedMod = { String exactName ->
    def candidate = file("${instancePath}/mods/${exactName}")
    if (!candidate.isFile()) {
        throw new GradleException("Missing exact installed dependency ${candidate}")
    }
    candidate
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf(files(installedMod('embeddium-0.3.31+mc1.20.1.jar')))
    compileOnly fg.deobf(files(installedMod('oculus-mc1.20.1-1.8.0.jar')))
    compileOnly fg.deobf(files(installedMod('Luxium Let there be light-2.8.0-pre-alpha.jar')))
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes('MixinConfigs': 'jem_luxium.mixins.json')
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('installToModpack', Copy) {
    dependsOn 'build'
    from tasks.named('jar').flatMap { it.archiveFile }
    into file("${instancePath}/mods")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach { enabled = false }
