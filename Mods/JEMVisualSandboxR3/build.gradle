plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
group = 'com.siirio.jemvisualsandbox'
version = 'r3'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/sandbox')
tasks.register('generateSandboxSkills', Exec) {
    commandLine 'python', 'generate-skills.py'
    inputs.files('../JEMRoles/src/main/java/com/siirio/jemroles/trait/RaceAbilities.java', '../JEMRoles/src/main/java/com/siirio/jemroles/trait/RaceEnvironment.java', '../JEMRoles/src/main/java/com/siirio/jemroles/trait/TemporaryPathSavedData.java', '../JEMRoles/src/main/java/com/siirio/jemroles/network/RaceVfxPacket.java', 'generate-skills.py')
    outputs.dir layout.buildDirectory.dir('generated/sandbox')
}
tasks.named('compileJava') { dependsOn 'generateSandboxSkills' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(Test).configureEach { enabled = false }
mixin { add sourceSets.main, 'jem_sandbox.refmap.json'; config 'jem_sandbox.mixins.json' }
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file('tmp/compileJava/jem_sandbox.refmap.json'))
}
jar {
    archiveBaseName = 'jem-visual-sandbox-overlay'
    manifest { attributes 'MixinConfigs': 'jem_sandbox.mixins.json' }
    finalizedBy 'reobfJar'
}
