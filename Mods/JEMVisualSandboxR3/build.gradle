plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.siirio.jemvisualsandbox'
version = 'r3'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/sandbox')
tasks.register('generateSandboxSkills', Exec) {
    commandLine 'python', 'generate-skills.py'
    inputs.files('../JEMRoles/src/main/java/com/siirio/jemroles/trait/RaceAbilities.java', '../JEMRoles/src/main/java/com/siirio/jemroles/trait/RaceEnvironment.java', '../JEMRoles/src/main/java/com/siirio/jemroles/network/RaceVfxPacket.java', 'generate-skills.py')
    outputs.dir layout.buildDirectory.dir('generated/sandbox')
}
tasks.named('compileJava') { dependsOn 'generateSandboxSkills' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(Test).configureEach { enabled = false }
jar { archiveBaseName = 'jem-visual-sandbox-overlay'; finalizedBy 'reobfJar' }
