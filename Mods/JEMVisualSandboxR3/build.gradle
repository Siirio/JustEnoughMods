plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
group = 'com.siirio.jemvisualsandbox'
version = '1.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf(files('../../Client/ManagedPack/mods/irons_spellbooks-1.20.1-3.15.6.jar'))
}
// Source alternatives make development authority impossible to enable in a production JAR.
def raceProfile = providers.gradleProperty('raceProfile').getOrElse('production')
if (!(raceProfile in ['sandbox', 'production'])) throw new GradleException('raceProfile must be sandbox or production')
if (providers.gradleProperty('raceProfileOutput').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('raceProfileOutput').get())
}
sourceSets.main.java.srcDir "src/${raceProfile}/java"
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/sandbox')
tasks.register('generateSandboxSkills', Exec) {
    commandLine 'python', 'generate-skills.py', layout.buildDirectory.get().asFile.absolutePath
    inputs.files('../JEMRoles/src/main/java/com/siirio/jemroles/trait/RaceAbilities.java', '../JEMRoles/src/main/java/com/siirio/jemroles/trait/RaceEnvironment.java', '../JEMRoles/src/main/java/com/siirio/jemroles/trait/TemporaryPathSavedData.java', '../JEMRoles/src/main/java/com/siirio/jemroles/race/RaceRules.java', '../JEMRoles/src/main/java/com/siirio/jemroles/network/RaceVfxPacket.java', 'generate-skills.py')
    outputs.dir layout.buildDirectory.dir('generated/sandbox')
}
tasks.named('compileJava') { dependsOn 'generateSandboxSkills' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('processResources') {
    // This legacy gallery receipt is being edited in another task; it owns no runtime asset.
    exclude 'assets/jem_visual_sandbox/workbench/provenance.json'
    doFirst { delete layout.buildDirectory.file('resources/main/assets/jem_visual_sandbox/workbench/provenance.json') }
}
tasks.withType(Test).configureEach { enabled = false }
mixin { add sourceSets.main, 'jem_sandbox.refmap.json'; config 'jem_sandbox.mixins.json' }
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file('tmp/compileJava/jem_sandbox.refmap.json'))
}
jar {
    archiveBaseName = 'jem-races'
    if (raceProfile == 'sandbox') archiveClassifier = 'sandbox'
    manifest { attributes 'JEM-Race-Profile': raceProfile.toUpperCase(java.util.Locale.ROOT) }
    manifest { attributes 'MixinConfigs': 'jem_sandbox.mixins.json' }
    finalizedBy 'reobfJar'
}

// Each explicit profile builds from identical owners into an isolated output directory.
['sandbox', 'production'].each { profile ->
    tasks.register("${profile}Jar", GradleBuild) {
        buildName = "jem-races-${profile}"
        dir = projectDir
        tasks = ['jar']
        startParameter.projectProperties = gradle.startParameter.projectProperties + [
            raceProfile: profile,
            raceProfileOutput: new File(projectDir, "build/${profile}-profile").absolutePath
        ]
    }
}
